# Compila l'app per il simulatore (senza firma) a ogni push e pull request su main.
name: Compila

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: compila-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compila:
    # Serve Xcode 27 (SDK di iOS 27): l'immagine macos-26 ha solo Xcode 26, Xcode 27 sta nell'immagine dedicata
    # `xcode-27` (anteprima pubblica di GitHub, https://github.com/actions/runner-images/issues/14404).
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          # La stessa versione usata in locale (27.0), non le beta che l'immagine installa accanto.
          XCODE=""
          for candidato in /Applications/Xcode_27.0.app /Applications/Xcode_27.app; do
            if [ -d "$candidato" ]; then XCODE="$candidato"; break; fi
          done
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 27.0 non è disponibile su questo runner"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pacchetti
        run: xcodebuild -resolvePackageDependencies -project StatalePlus.xcodeproj -scheme StatalePlus

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project StatalePlus.xcodeproj -scheme StatalePlus \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
